# CI/CD for screenwriter_api_mcp — private service: tests/lint/build only, no npm publish
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  id-token: write
  deployments: write
  packages: write

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@main
    with:
      skip-npm-publish: true
      # Install @sudobility/* from GitHub Packages (they no longer exist on
      # npmjs). This routes the test/build install to npm.pkg.github.com with
      # GH_PACKAGES_READ_TOKEN auth; skip-npm-publish keeps this repo unpublished.
      publish-target: github
    secrets: inherit
